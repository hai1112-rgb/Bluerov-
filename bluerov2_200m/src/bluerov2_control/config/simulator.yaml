# simulator.yaml - BlueROV2 Enhanced Dynamics Config
# =====================================================
# BlueROV2 Heavy physical parameters (Blue Robotics)
# Sources: Blue Robotics references, Fossen-style marine dynamics, and practical tuning
#
# Used by: start_simulator.launch.py and start_enhanced_world.launch.py

simple_dynamics_sim:
  ros__parameters:

    # ---- Timing ----
    update_rate: 50.0          # Hz

    # ---- Frames ----
    world_frame: "world"
    base_frame: "base_link"
    publish_tf: false

    # ---- Topics ----
    commanded_wrench_topic: "thruster_manager/commanded_wrench"
    odom_topic: "sim/pose_gt"
    joint_state_topic: "joint_states"
    pressure_topic: "sim/water_pressure"

    # ---- BlueROV2 Heavy Physical Parameters ----
    # Reference baseline: BlueROV2 Heavy technical data.
    mass: 11.5                 # kg - unloaded vehicle mass
    water_depth: 200.0         # m - simulated operating depth
    water_density: 1025.0      # kg/m^3 - coastal seawater
    gravity: 9.80665           # m/s^2
    vehicle_volume: 0.01135    # m^3 - slightly positive, near-neutral buoyancy

    # Hydrodynamic added mass from CFD-style tuning.
    added_mass_x: 6.357        # kg
    added_mass_y: 7.121        # kg
    added_mass_z: 18.68        # kg

    # Rotational inertia around the body axes.
    yaw_inertia: 0.252         # kg·m²
    pitch_inertia: 0.245       # kg·m²
    roll_inertia: 0.245        # kg·m²
    center_of_buoyancy_z: 0.035
    metacentric_roll_stiffness: 4.5
    metacentric_pitch_stiffness: 4.5

    # Linear drag coefficients (N / (m/s))
    # Tuned from coast-down behavior in water.
    linear_drag_xy: 13.7       # Horizontal drag from the frame profile
    linear_drag_z: 33.0        # Vertical drag from the larger projected area

    # Angular drag (N·m / (rad/s))
    angular_drag_x: 3.8        # Roll
    angular_drag_y: 4.0        # Pitch
    angular_drag_z: 6.5        # Yaw drag from the body and rear structure

    # Quadratic drag for higher speeds, N / (m/s)^2.
    quad_drag_xy: 8.0
    quad_drag_z: 10.0
    quad_angular_drag_xy: 0.8

    # ---- Speed Limits (T200 thruster specifications) ----
    # Six-thruster model with T200-style limits.
    # Forward: four horizontal thrusters -> approximately 1.5 m/s
    # Vertical: two vertical thrusters -> approximately 0.8 m/s
    max_linear_speed: 1.5      # m/s
    max_vertical_speed: 0.8    # m/s
    max_roll_rate: 1.0         # rad/s
    max_pitch_rate: 1.0        # rad/s
    max_yaw_rate: 1.2          # rad/s
    max_attitude_angle: 1.0471975512  # rad, +/-60 deg

    # ---- Initial Position ----
    initial_x: 0.0
    initial_y: 0.0
    initial_z: -200.0          # Start at 200 m operating depth
    initial_roll: 0.0
    initial_pitch: 0.0
    initial_yaw: 0.0

    # ---- Wave Parameters ----
    # Surface-wave influence is treated as negligible near 200 m.
    wave_amplitude: 0.0        # N - no surface-wave forcing at deep operating depth
    wave_period: 6.0           # s - retained for shallow-water compatibility
    wave_direction: 0.0        # rad - world frame, 0 = +X

    # ---- Ocean Current ----
    # Water velocity drives drag through relative vehicle-water speed.
    current_speed: 0.24        # m/s - seabed shear reduces this to about 0.13 m/s near 200 m
    current_direction: 0.2617993878  # rad, 15 deg from the world +X axis
    current_vertical_speed: 0.0

    # 200 m environment notes:
    # Absolute pressure is approximately 21 bar.
    # Natural light is very weak; lights and sonar are the primary inspection aids.
    # Default current is mild-to-moderate for station-keeping tests without destabilizing the simulation.
